<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cocina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="auth" id="paso-correo"><h1>Cocina</h1><p>Escribe tu correo y te enviaremos un código.</p>
  <input id="correo" type="email" inputmode="email" autocomplete="email" placeholder="correo@ejemplo.com">
  <button class="cta" id="enviar" style="margin-top:14px">Enviar código</button></div>
<div class="auth" id="paso-codigo" hidden><h1>Revisa tu correo</h1><p>Escribe el código que te enviamos.</p>
  <input id="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="Código">
  <button class="cta" id="entrar" style="margin-top:14px">Entrar</button></div>
<div id="panel" hidden>
  <header class="top">
    <div class="fila"><h1>Cocina</h1><button class="llamar" id="salir">Salir</button></div>
    <nav class="tabs"><button data-col="recibido">Nuevos <i>0</i></button><button data-col="en_preparacion">Preparando <i>0</i></button><button data-col="listo">Listos <i>0</i></button></nav>
  </header>
  <main id="lista" class="lista"></main>
</div>
<div id="toast" role="status"></div>
<script src="/config.js"></script>
<script type="module" src="/assets/cocina.js"></script>
</body>
</html>
