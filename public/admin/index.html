<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administración</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="auth" id="paso-correo"><h1>Administración</h1><p>Escribe tu correo y te enviaremos un código.</p>
  <input id="correo" type="email" inputmode="email" autocomplete="email" placeholder="correo@ejemplo.com">
  <button class="cta" id="enviar" style="margin-top:14px">Enviar código</button></div>
<div class="auth" id="paso-codigo" hidden><h1>Revisa tu correo</h1><p>Escribe el código que te enviamos.</p>
  <input id="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="Código">
  <button class="cta" id="entrar" style="margin-top:14px">Entrar</button></div>
<div id="panel-admin" hidden>
  <header class="top">
    <div class="fila"><h1>Panel</h1><div class="acciones" style="flex-direction:row"><a class="llamar" style="text-decoration:none" href="/cocina/">Cocina</a><button class="llamar" id="salir">Salir</button></div></div>
    <nav class="tabs"><button data-tab="pedidos">Pedidos</button><button data-tab="menu">Menú</button><button data-tab="mesas">Mesas y QR</button><button data-tab="cobros">Cobros</button><button data-tab="pagos">Métodos de pago</button><button data-tab="tasa">Tasa</button></nav>
  </header>
  <main id="vista" class="adm"></main>
</div>
<div id="toast" role="status"></div>
<script src="/config.js"></script>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
