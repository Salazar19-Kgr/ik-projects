name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base-de-datos:
    name: Migraciones y pruebas SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Aplicar migraciones y ejecutar pruebas
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
        run: sh scripts/test-db.sh
